# Render Blueprint: New > Blueprint > pick this repo. Free plan sleeps after 15 min idle.
services:
  - type: web
    name: care-companion
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL        # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: SECRET_KEY          # signs sign-in tokens and photo links
        generateValue: true
      - key: GEMINI_API_KEY      # from Google AI Studio; leave empty to run in offline mode
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: DEMO_SEED           # creates the Suresh / Anita demo accounts on an empty database
        value: "1"
